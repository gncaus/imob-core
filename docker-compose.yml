name: imob-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: imob
      POSTGRES_PASSWORD: imob
      POSTGRES_DB: imob
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U imob -d imob']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # O repositório oficial minio/minio saiu do Docker Hub; pgsty/minio é o fork mantido pela comunidade.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: imob
      MINIO_ROOT_PASSWORD: imob-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------------------------
  # Aplicação completa (profile "app"): docker compose --profile app up -d --build
  # Sem o profile, o compose sobe só a infraestrutura acima, para desenvolver com `pnpm dev`.
  # ---------------------------------------------------------------------------------------------

  # API + worker de roteamento. Na subida aplica as migrações e popula o banco vazio (seed).
  api:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://imob:imob@postgres:5432/imob?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: imob
      S3_SECRET_KEY: imob-secret
      S3_BUCKET: imob-photos
      # Endereços vistos pelo navegador (fotos e feed), não pela rede interna do compose.
      PHOTOS_PUBLIC_BASE_URL: http://localhost:9000/imob-photos
      API_PUBLIC_URL: http://localhost:3333
      # Acesso local por http://localhost: o cookie de sessão não exige HTTPS.
      COOKIE_SECURE: 'false'
      LOG_LEVEL: info
      JWT_SECRET: ${JWT_SECRET:-demo-local-jwt-secret-nao-usar-em-producao-123456}
      GRUPO_OLX_WEBHOOK_SECRET: ${GRUPO_OLX_WEBHOOK_SECRET:-demo-local-webhook-secret}
      COMPANY_NAME: ${COMPANY_NAME:-Imobiliária Demo}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-contato@imobiliaria-demo.com.br}
      COMPANY_PHONE: ${COMPANY_PHONE:-(27) 3200-0000}
      COMPANY_WEBSITE: ${COMPANY_WEBSITE:-https://www.imobiliaria-demo.com.br}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@imob.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_AGENT_PASSWORD: ${SEED_AGENT_PASSWORD:-corretor12345}
    ports:
      - '3333:3333'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3333/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Painel. O proxy /api/* aponta para o serviço "api" (fixado no build da imagem).
  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3333
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
  minio-data:
